# Planning inputs. Values marked "brief" come from the challenge brief; "assumed" are our estimates
# (see report/report.md, Assumptions). starting_crews is calibrated by `python -m optimizer.calibrate`.
late_cost: 20            # brief: $ per request not closed within its month
late30_cost: 100         # brief: extra $ per request open 30+ days
severance_rate: 0.25     # brief: 25% of annual salary when a crew is released (plus 1 month notice)
seasonal_premium: 0.30   # brief: Parks seasonal crews cost 30% more
training_months: 1       # brief: hired crews are paid but not productive for 1 month
default_on_time_target: 0.85   # assumed: the city's target; the brief leaves it open

departments:
  Public Works:
    crew_cost: 130000            # brief
    requests_per_crew_month: 250 # assumed: mostly quick jobs (code enforcement, pickups, cleaning)
    seasonal_allowed: false
  Transportation:
    crew_cost: 130000            # assumed same as Public Works
    requests_per_crew_month: 300 # assumed: parking enforcement dominates and is fast
    seasonal_allowed: false
  Parks:
    crew_cost: 130000            # assumed same as Public Works
    requests_per_crew_month: 60  # assumed: tree work is slow
    seasonal_allowed: true
  Inspectional Services:
    crew_cost: 130000            # assumed same as Public Works
    requests_per_crew_month: 70  # assumed: inspections take a site visit and paperwork
    seasonal_allowed: false

# calibrated so that flat staffing on 2024 demand reproduces the real 2024 on-time rate
starting_crews:
  Public Works: 53
  Transportation: 20
  Parks: 38
  Inspectional Services: 20

llm:
  host: http://localhost:11434
  intake_model: qwen2.5:3b
  agent_model: qwen2.5:3b
  vision_model: moondream
  clarify_threshold: 0.6
