# docker compose up  ->  app on http://localhost:8000, Ollama on :11434
# Needs the processed data and contracts (run `make data all` once on the host; they are mounted in).
services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    # first run: docker compose exec ollama ollama pull qwen2.5:3b && docker compose exec ollama ollama pull moondream
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./data:/app/data
      - ./contracts:/app/contracts
      - ./eval:/app/eval
    depends_on: [ollama]
volumes:
  ollama: {}
